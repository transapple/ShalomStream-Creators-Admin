<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShalomStream Admin</title>
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo-icon.png"><meta name="theme-color" content="#062a78"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Admin">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#0d1b3d;--mut:#667;--line:#dde1ea;--gold:#b8861f;--navy:#062a78;--red:#c0392b;--grn:#1e8e4e}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b24;--ink:#eef1f7;--mut:#9aa3b5;--line:#2a3140}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:36px;height:36px;border-radius:50%;flex:none;background:#fff}header b{flex:1;font-size:17px}header b span{color:#e8c36a}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit}
nav button.on{background:var(--gold);border-color:var(--gold);color:#fff}
main{padding:14px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat b{font-size:26px;display:block}.stat small{color:var(--mut)}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar select{width:auto}
button.b{border:0;border-radius:8px;padding:8px 12px;font:inherit;background:var(--navy);color:#fff}
button.g{background:var(--gold)}button.r{background:var(--red)}button.o{background:none;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.t{font-weight:600}.m{color:var(--mut);font-size:13px;word-break:break-word}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line)}.tag.ok{background:var(--grn);color:#fff}.tag.bad{background:var(--red);color:#fff}
.lp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative}
.lp.hb{padding-right:56px}.bell{position:absolute;top:10px;right:10px;width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:99px}
.hint{color:var(--mut);font-size:12px;margin:0 0 10px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;border-radius:99px;font:inherit}.seg button.on{background:var(--gold);border-color:var(--gold);color:#fff}
#sh{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sh .pn{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:8px}
#sh .pn .t{margin-bottom:4px;word-break:break-word}#sh .pn button{padding:13px;font-size:16px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none}
</style></head><body>
<div id="app">
<header><img src="logo.png" alt="ShalomStream Admin logo"><b>Shalom<span>Stream</span> Admin</b></header>
<nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const sb=supabase.createClient('https://ixmyndnerktftrgqopry.supabase.co','sb_publishable_E2WKhhnJzYJ8GI28zsvggA_awiXq_iK'),BUCKET='media';
const $=i=>document.getElementById(i),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=v=>v?new Date(v).toLocaleDateString():'-';
let tab='overview',data={},q='',flt='',ctype='',acct='listener',lpT=null,lpFired=false,lpX=0,lpY=0,shAt=0;
const TABS=[['overview','Overview'],['creators','All creators'],['creators:church','Churches'],['creators:ministry','Ministries'],['creators:choir','Choirs'],['creators:artist','Artists'],['creators:other','Other groups'],['content','Content'],['users','Accounts'],['support','Creator messages'],['comments','Comments'],['churches','Church submissions']];
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2800)}
async function rpc(n,a){const r=await sb.rpc(n,a||{});if(r.error)throw r.error;return r.data}
function boot(){
 $('nav').innerHTML=TABS.map(t=>`<button id="t-${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');go('overview')}
async function go(t){const pt=t.split(':');tab=pt[0];ctype=pt[1]||'';q='';flt='';TABS.forEach(x=>$('t-'+x[0]).classList.toggle('on',x[0]===t));$('main').innerHTML='<p class="m">Loading…</p>';
 try{const f={overview:'admin_overview',creators:'admin_creators',content:'admin_content',users:'admin_users',support:'admin_support',comments:'admin_comments',churches:'admin_churches'}[t];data[t]=await rpc(f);draw()}
 catch(e){$('main').innerHTML='<div class="card">Could not load: '+E(e.message)+'</div>'}}
function bar(opts){return `<div class="bar"><input placeholder="Search…" value="${E(q)}" oninput="q=this.value;list()">${opts?`<select onchange="flt=this.value;list()">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:''}</div><div id="list"></div>`}
function draw(){const m=$('main');
 if(tab==='overview'){const o=data.overview,S=[['creators','Creators'],['pending','Awaiting approval'],['listeners','Listeners'],['content','Content items'],['hidden','Hidden content'],['comments','Comments'],['churches','Pending churches'],['support','Open creator messages']];
  m.innerHTML='<div class="grid">'+S.map(s=>`<div class="card stat"><b>${o[s[0]]}</b><small>${s[1]}</small></div>`).join('')+'</div>';return}
 m.innerHTML=(tab==='users'?acctSeg():'')+(tab==='content'||tab==='users'?`<p class="hint">${tab==='content'?'Tap a card to open it · long-press for more actions':'Long-press an account for actions'}</p>`:'')+bar(tab==='creators'?[['','All'],['pending','Pending'],['approved','Approved'],['rejected','Rejected']]:tab==='content'?[['','All'],['published','Published'],['in_review','In review'],['changes_requested','Changes requested'],['rejected','Rejected'],['song','Songs'],['message','Messages'],['video','Videos'],['live','Live']]:tab==='users'?null:tab==='support'?[['','All'],['open','Open'],['answered','Answered'],['closed','Closed']]:null);list()}
function list(){const L=(data[tab]||[]),s=q.toLowerCase(),h=x=>JSON.stringify(x).toLowerCase().includes(s);let rows;
 if(tab==='creators')rows=L.filter(c=>h(c)&&(!ctype||c.type===ctype)&&(!flt||c.status===flt)).map(c=>`<div class="card"><div class="t">${E(c.name)} <span class="tag ${c.status==='approved'?'ok':c.status==='rejected'?'bad':''}">${E(c.status)}</span></div><div class="m">${E(c.type)} · ${E(c.category)} · ${E(c.location)}</div><div class="m">@${E(c.username)} · ${E(c.phone)} · ${E(c.email)} · ${c.items} items${c.open_support?` · <b>${c.open_support} open message(s)</b>`:''}</div><div class="m">Contact: ${E(c.contact_person)} · ${E(c.address)} · ${E(c.website)}</div><div class="m">${E(c.description)}</div>${c.rejection_reason?`<div class="m">Reason: ${E(c.rejection_reason)}</div>`:''}<div class="row">${c.status!=='approved'?`<button class="b g" onclick="cstat('${c.id}','approved')">Approve</button>`:''}${c.status!=='rejected'?`<button class="b o" onclick="cstat('${c.id}','rejected')">Reject</button>`:''}<button class="b o" onclick="editCr('${c.id}')">Edit details</button><button class="b r" onclick="delUser('${c.user_id}','${E(c.name).replace(/'/g,'')}')">Delete account</button></div></div>`);
 if(tab==='support')flt=flt;
 if(tab==='content')rows=L.filter(c=>h(c)&&(!flt||c.status===flt||c.kind===flt)).map(c=>`<div class="card lp${c.status==='published'?' hb':''}" data-k="content" data-id="${c.id}"><div class="t">${E(c.title)} <span class="tag ${c.status==='published'?'ok':'bad'}">${E(c.status)}</span> <span class="tag">${E(c.kind)}</span></div><div class="m">${E(c.creator||c.artist_name)} · ${D(c.created_at)} · ${c.play_count||0} plays</div>${c.status==='published'?`<button class="b o bell" title="Request changes" aria-label="Request changes" onclick="setStatus('${c.id}','changes_requested')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>`:`<div class="row"><button class="b g" onclick="setStatus('${c.id}','published')">Approve</button></div>`}</div>`);
 if(tab==='users')rows=L.filter(u=>h(u)&&(acct==='listener')===!!u.listener).map(u=>`<div class="card lp" data-k="users" data-id="${u.id}"><div class="t">${E(u.name||u.username||u.email)} <span class="tag">${u.admin?'Admin':u.listener?'Listener':'Creator'}</span></div><div class="m">${E(u.listener?u.username:u.email)} · joined ${D(u.created_at)} · last seen ${D(u.last_sign_in_at)}</div></div>`);
 if(tab==='support')rows=L.filter(c=>h(c)&&(!flt||c.status===flt)).map(c=>`<div class="card"><div class="t">${E(c.subject)} <span class="tag ${c.status==='open'?'bad':'ok'}">${E(c.status)}</span> <span class="tag">${E(c.kind)}</span></div><div class="m">${E(c.creator)} · ${E(c.email)} · ${D(c.created_at)}</div><p>${E(c.body)}</p><textarea id="r-${c.id}" rows="3" style="width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)" placeholder="Write a reply">${E(c.admin_reply||'')}</textarea><div class="row"><button class="b g" onclick="reply('${c.id}','answered')">Send reply</button><button class="b o" onclick="reply('${c.id}','closed')">Close</button></div></div>`);
 if(tab==='comments')rows=L.filter(h).map(c=>`<div class="card"><div class="t">${E(c.body)}</div><div class="m">${E(c.author_name)} on “${E(c.content_title)}” · ${D(c.created_at)}</div><div class="row"><button class="b r" onclick="delComment('${c.id}')">Delete comment</button></div></div>`);
 if(tab==='churches')rows=L.filter(h).map(c=>`<div class="card"><div class="t">${E(c.name)}</div><span class="tag ${c.status==='verified'?'ok':c.status==='rejected'?'bad':''}">${E(c.status)}</span><div class="m">${E(c.location)} · ${E(c.contact_email)}</div><div class="m">${E(c.description)}</div><div class="row"><button class="b g" onclick="setChurch('${c.id}','verified')">Verify</button><button class="b o" onclick="setChurch('${c.id}','rejected')">Reject</button><button class="b r" onclick="delChurch('${c.id}')">Delete</button></div></div>`);
 $('list').innerHTML=(tab==='creators'?`<p class="m">${rows.length} ${ctype||'creator'} account(s)</p>`:'')+(rows.length?rows.join(''):'<p class="m">Nothing found.</p>')}
async function act(fn,msg){try{await fn();toast(msg);go(tab)}catch(e){toast(e.message)}}
const cstat=(id,s)=>{let r=null;if(s==='rejected'){r=prompt('Reason for rejecting (the creator will see it):','');if(r===null)return}act(()=>rpc('admin_set_creator_status',{p_id:id,p_status:s,p_reason:r}),s==='approved'?'Creator approved':'Creator rejected')};
function editCr(id){const c=data.creators.find(x=>x.id===id),F=[['name','Name'],['username','Username'],['phone','Phone'],['category','Category'],['contact_person','Contact person'],['location','Location'],['address','Address'],['website','Website'],['description','About']],d=document.createElement('div');d.id='ed';d.style.cssText='position:fixed;inset:0;background:#0009;overflow:auto;padding:14px;z-index:9';
 d.innerHTML=`<div class="card" style="max-width:560px;margin:auto"><div class="t">Edit ${E(c.name)}</div><label class="m">Type</label><select id="f-type">${['church','ministry','choir','artist','other'].map(x=>`<option ${x===c.type?'selected':''}>${x}</option>`).join('')}</select>`+F.map(f=>`<label class="m">${f[1]}</label><input id="f-${f[0]}" value="${E(c[f[0]])}">`).join('')+`<div class="row"><button class="b g" onclick="saveCr('${id}')">Save</button><button class="b o" onclick="$('ed').remove()">Cancel</button></div></div>`;document.body.appendChild(d)}
const saveCr=id=>{const g=k=>$('f-'+k).value;act(async()=>{await rpc('admin_update_creator',{p_id:id,p_name:g('name'),p_type:g('type'),p_location:g('location'),p_description:g('description'),p_username:g('username'),p_phone:g('phone'),p_category:g('category'),p_contact_person:g('contact_person'),p_address:g('address'),p_website:g('website')});$('ed').remove()},'Saved')};
const verify=(id,v)=>act(()=>rpc('admin_set_verified',{p_id:id,p_v:v}),v?'Creator verified':'Verification removed');
const setStatus=(id,s)=>act(()=>rpc('admin_set_status',{p_id:id,p_status:s}),'Updated');
const setChurch=(id,s)=>act(()=>rpc('admin_set_church',{p_id:id,p_status:s}),'Church '+s);
const reply=(id,st)=>{const t=$('r-'+id).value;act(()=>rpc('admin_reply_support',{p_id:id,p_reply:t,p_status:st}),st==='closed'?'Closed':'Reply sent')};
const delComment=id=>confirm('Delete this comment?')&&act(()=>rpc('admin_delete_comment',{p_id:id}),'Comment deleted');
const delChurch=id=>confirm('Delete this submission?')&&act(()=>rpc('admin_delete_church',{p_id:id}),'Deleted');
const pathOf=u=>{const m=String(u||'').split('/'+BUCKET+'/');return m[1]?decodeURIComponent(m[1].split('?')[0]):null};
function delContent(id){const c=data.content.find(x=>x.id===id);if(!confirm('Permanently delete "'+c.title+'" and its files?'))return;
 act(async()=>{const p=[c.storage_path,pathOf(c.thumbnail_url)].filter(Boolean);if(p.length)await sb.storage.from(BUCKET).remove(p);await rpc('admin_delete_content',{p_id:id})},'Content deleted')}
function delUser(uid,name){if(!uid||!confirm('Delete account "'+name+'", all their content and files? This cannot be undone.'))return;
 act(async()=>{const f=await sb.storage.from(BUCKET).list(uid,{limit:1000});if(f.data&&f.data.length)await sb.storage.from(BUCKET).remove(f.data.map(x=>uid+'/'+x.name));await rpc('admin_delete_user',{p_id:uid})},'Account deleted')}

function acctSeg(){const U=data.users||[],n=v=>U.filter(u=>(v==='listener')===!!u.listener).length;return `<div class="seg"><button class="${acct==='listener'?'on':''}" onclick="setAcct('listener')">Listeners (${n('listener')})</button><button class="${acct==='creator'?'on':''}" onclick="setAcct('creator')">Creators (${n('creator')})</button></div>`}
function setAcct(v){acct=v;q='';draw()}
function closeSheet(){const o=$('sh');if(o)o.remove()}
function sheet(k,id){closeSheet();let title='',acts=[];
 if(k==='content'){const c=(data.content||[]).find(x=>x.id===id);if(!c)return;title=c.title;
  if(c.status!=='rejected')acts.push(['Reject','o',()=>setStatus(id,'rejected')]);
  acts.push(['Delete','r',()=>delContent(id)])}
 else if(k==='users'){const u=(data.users||[]).find(x=>x.id===id);if(!u)return;if(u.admin){toast('Admin accounts cannot be changed');return}
  title=u.name||u.username||u.email;acts.push(['Delete account','r',()=>delUser(id,String(title).replace(/'/g,''))])}
 else return;
 const o=document.createElement('div');o.id='sh';const p=document.createElement('div');p.className='pn';
 const h=document.createElement('div');h.className='t';h.textContent=title;p.appendChild(h);
 acts.concat([['Cancel','o',()=>{}]]).forEach(a=>{const b=document.createElement('button');b.className='b '+a[1];b.textContent=a[0];b.onclick=()=>{if(Date.now()-shAt<400)return;closeSheet();a[2]()};p.appendChild(b)});
 o.appendChild(p);o.addEventListener('click',e=>{if(e.target===o&&Date.now()-shAt>=400)closeSheet()});document.body.appendChild(o);shAt=Date.now()}
(function(){const M=$('main'),skip=t=>t.closest('button,a,input,select,textarea');
 M.addEventListener('pointerdown',e=>{const c=e.target.closest('.lp');if(!c||skip(e.target))return;lpFired=false;lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);lpT=setTimeout(()=>{lpT=null;lpFired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}sheet(c.dataset.k,c.dataset.id)},550)});
 M.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)){clearTimeout(lpT);lpT=null}});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>M.addEventListener(n,()=>{clearTimeout(lpT);lpT=null}));
 M.addEventListener('contextmenu',e=>{const c=e.target.closest('.lp');if(!c)return;e.preventDefault();clearTimeout(lpT);lpT=null;if(!$('sh')){lpFired=true;sheet(c.dataset.k,c.dataset.id)}});
 M.addEventListener('click',e=>{const c=e.target.closest('.lp');if(!c||skip(e.target))return;if(lpFired){lpFired=false;return}
  if(c.dataset.k==='content'){const x=(data.content||[]).find(v=>v.id===c.dataset.id);if(x&&x.media_url)window.open(x.media_url,'_blank');else toast('No file to open')}})})();
boot();
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script></body></html>
